<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#123B5D"/>
  <title>Make Ready Agent</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header>
    <div>
      <h1>Make Ready Agent</h1>
      <p>PRM0001297784</p>
    </div>
    <button id="nearestBtn">Ближайший столб</button>
  </header>

  <main>
    <section class="toolbar">
      <input id="search" placeholder="Pole 241 или 110490953"/>
      <select id="statusFilter">
        <option value="">Все статусы</option>
        <option>Not started</option>
        <option>In progress</option>
        <option>Completed</option>
        <option>Problem</option>
      </select>
    </section>

    <section id="stats" class="stats"></section>
    <section id="list" class="list"></section>
  </main>

  <dialog id="poleDialog">
    <form method="dialog" class="card">
      <button class="close" value="cancel">×</button>
      <h2 id="dlgTitle"></h2>
      <div id="dlgId" class="muted"></div>
      <a id="navigateLink" class="primary-link" target="_blank">Открыть навигацию</a>

      <label>Работы</label>
      <pre id="description"></pre>

      <div class="grid2">
        <div>
          <label>Фактическая HOA</label>
          <input id="actualHoa"/>
        </div>
        <div>
          <label>Высота изменилась?</label>
          <select id="heightChanged"><option>No</option><option>Yes</option></select>
        </div>
      </div>

      <div class="grid2">
        <div>
          <label>Distance, ft</label>
          <input id="distance" inputmode="decimal"/>
        </div>
        <div>
          <label>Статус</label>
          <select id="status">
            <option>Not started</option>
            <option>In progress</option>
            <option>Completed</option>
            <option>Problem</option>
          </select>
        </div>
      </div>

      <label>Trimming</label>
      <textarea id="trimming"></textarea>

      <label>Фото до</label>
      <input id="beforePhotos" type="file" accept="image/*" capture="environment" multiple/>
      <div id="beforeCount" class="photo-count"></div>

      <label>Фото после</label>
      <input id="afterPhotos" type="file" accept="image/*" capture="environment" multiple/>
      <div id="afterCount" class="photo-count"></div>

      <label>Заметки</label>
      <textarea id="notes"></textarea>

      <button id="saveBtn" class="save" value="default">Сохранить</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
