<script>
const WORK_TYPES = [
  ["newStrand", "1. Place new strand", "FT"],
  ["installDownGuy", "2. Install down guy", "EA"],
  ["reworkDownGuy", "3. Transfer / rework existing down guy", "EA"],
  ["overheadGuy", "4. Place overhead guy", "EA"],
  ["groundBond", "5. Install pole ground and bond", "EA"],
  ["raiseLower", "6. Raise or lower pole attachment", "Pole"],
  ["riserGuard", "7. Install new riser guard", "10 ft units"],
  ["treeTrimming", "8. Tree trimming", "FT"],
  ["fArms", "9. Place F-arms", "EA"],
  ["guardArm", "10. Place guard arm", "EA"],
  ["doubleGuardArm", "11. Place double guard arm", "EA"],
  ["removeArm", "12. Remove arm", "EA"],
  ["poleTransfer", "13. Pole transfer", "EA"]
];

let myMapsUrl = "";
let poles = PROJECT_DATA.map(p => ({
  ...p,
  status:"Not started",
  work:{},
  originalHoa:"",
  actualHoa:"",
  heightChangeDescription:"",
  anchorStatus:"",
  anchorDetails:"",
  bondingStatus:"",
  bondingDetails:"",
  vgrStatus:"",
  vgrDetails:"",
  downGuyActual:"",
  changeReason:"",
  fieldNotes:"",
  crew:""
}));

let currentIndex = null;
let importItems = [];
const $ = s => document.querySelector(s);

function createWorkFields(){
  $("#workFields").innerHTML = WORK_TYPES.map(([key,label,unit])=>`
    <div class="work-item">
      <label>${label} (${unit})</label>
      <input id="work_${key}" type="number" min="0" step="any" placeholder="0">
    </div>`).join("");
}

function badgeClass(s){
  return s==="Completed"?"completed":
    s==="In progress"?"progress":
    s==="Problem"?"problem":"not";
}

function render(){
  const q = $("#search").value.toLowerCase();
  const sf = $("#statusFilter").value;
  const filtered = poles.filter(p=>{
    const hit = (`${p.projectPole} ${p.poleId}`).toLowerCase().includes(q);
    return hit && (!sf || p.status===sf);
  });

  $("#list").innerHTML = filtered.map(p=>`
    <article class="pole" onclick="openPole(${p.projectPole})">
      <div class="pole-top">
        <div>
          <h3>Pole ${p.projectPole}</h3>
          <div class="muted">${p.poleId||"No pole ID"}</div>
        </div>
        <span class="badge ${badgeClass(p.status)}">${p.status}</span>
      </div>
      <div class="desc">${p.description}</div>
    </article>`).join("");

  const c = s => poles.filter(p=>p.status===s).length;
  $("#stats").innerHTML = `
    <div class="stat"><b>${poles.length}</b>Всего</div>
    <div class="stat"><b>${c("Not started")}</b>Не начато</div>
    <div class="stat"><b>${c("In progress")}</b>В работе</div>
    <div class="stat"><b>${c("Completed")}</b>Готово</div>`;
}

function openMyMaps(){
  if(!myMapsUrl || myMapsUrl.includes("PASTE_")){
    alert("Ссылка Google My Maps ещё не добавлена в Code.gs");
    return;
  }
  window.open(myMapsUrl, "_blank");
}

function mergeRemote(remote){
  const byPole = Object.fromEntries(remote.map(r=>[Number(r.projectPole),r]));
  poles = poles.map(p=>({...p,...(byPole[p.projectPole]||{})}));
  render();
}

window.openPole = function(projectPole){
  currentIndex = poles.findIndex(p=>p.projectPole===projectPole);
  const p = poles[currentIndex];

  $("#dlgTitle").textContent = `Pole ${p.projectPole}`;
  $("#dlgId").textContent = p.poleId || "No pole ID";
  $("#description").textContent = p.description;

  WORK_TYPES.forEach(([key])=>{
    $(`#work_${key}`).value = p.work?.[key] ?? "";
  });

  $("#originalHoa").value = p.originalHoa || "";
  $("#actualHoa").value = p.actualHoa || "";
  $("#heightChangeDescription").value = p.heightChangeDescription || "";
  $("#anchorStatus").value = p.anchorStatus || "";
  $("#anchorDetails").value = p.anchorDetails || "";
  $("#bondingStatus").value = p.bondingStatus || "";
  $("#bondingDetails").value = p.bondingDetails || "";
  $("#vgrStatus").value = p.vgrStatus || "";
  $("#vgrDetails").value = p.vgrDetails || "";
  $("#downGuyActual").value = p.downGuyActual || "";
  $("#changeReason").value = p.changeReason || "";
  $("#status").value = p.status || "Not started";
  $("#crew").value = p.crew || "";
  $("#notes").value = p.fieldNotes || "";
  $("#saveMessage").textContent = "";

  $("#poleDialog").showModal();
};

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result.split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function uploadFiles(p, selector, type){
  const files = [...$(selector).files];
  for(let i=0;i<files.length;i++){
    const base64 = await fileToBase64(files[i]);
    await new Promise((resolve,reject)=>{
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .uploadPhoto({
          projectPole:p.projectPole,
          poleId:p.poleId,
          photoType:type,
          index:i+1,
          mimeType:files[i].type || "image/jpeg",
          base64
        });
    });
  }
}

$("#saveBtn").addEventListener("click", async ()=>{
  const p = poles[currentIndex];
  const work = {};

  WORK_TYPES.forEach(([key])=>{
    work[key] = $(`#work_${key}`).value;
  });

  Object.assign(p, {
    work,
    originalHoa:$("#originalHoa").value,
    actualHoa:$("#actualHoa").value,
    heightChangeDescription:$("#heightChangeDescription").value,
    anchorStatus:$("#anchorStatus").value,
    anchorDetails:$("#anchorDetails").value,
    bondingStatus:$("#bondingStatus").value,
    bondingDetails:$("#bondingDetails").value,
    vgrStatus:$("#vgrStatus").value,
    vgrDetails:$("#vgrDetails").value,
    downGuyActual:$("#downGuyActual").value,
    changeReason:$("#changeReason").value,
    status:$("#status").value,
    crew:$("#crew").value,
    fieldNotes:$("#notes").value
  });

  $("#saveBtn").disabled = true;
  $("#saveMessage").textContent = "Сохраняю...";

  try{
    await new Promise((resolve,reject)=>{
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .savePole(p);
    });

    await uploadFiles(p, "#beforePhotos", "BEFORE");
    await uploadFiles(p, "#afterPhotos", "AFTER");

    $("#saveMessage").textContent = "Сохранено";
    render();
    setTimeout(()=>$("#poleDialog").close(), 700);
  }catch(err){
    $("#saveMessage").textContent = "Ошибка: " + (err.message || err);
  }finally{
    $("#saveBtn").disabled = false;
  }
});


function distanceFt(lat1,lon1,lat2,lon2){
  const R=20902231, rad=x=>x*Math.PI/180;
  const dLat=rad(lat2-lat1), dLon=rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function nearestPoleGps(lat,lon){
  let best=null,bestD=Infinity;
  poles.forEach(p=>{const d=distanceFt(lat,lon,p.lat,p.lon); if(d<bestD){bestD=d;best=p;}});
  return {pole:best,distance:bestD};
}
async function exifFor(file){
  try{return (await exifr.parse(file,{gps:true,tiff:true,exif:true}))||{};}catch(e){return {};}
}
async function uploadOne(file,p,type,index){
  const base64=await fileToBase64(file);
  return await new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadPhoto({
      projectPole:p.projectPole,poleId:p.poleId,photoType:type,index,
      mimeType:file.type||"image/jpeg",base64
    });
  });
}
async function analyzeImport(){
  const files=[...$("#bulkPhotos").files,...$("#bulkFolder").files];
  if(!files.length)return alert("Выбери фотографии или папку");
  const maxD=Number($("#maxDistance").value), mode=$("#importMode").value;
  $("#analyzeImportBtn").disabled=true; const items=[];
  for(let i=0;i<files.length;i++){
    const f=files[i], x=await exifFor(f);
    const lat=x.latitude,lon=x.longitude,dt=x.DateTimeOriginal||x.CreateDate||new Date(f.lastModified||0);
    let match=null;
    if(Number.isFinite(lat)&&Number.isFinite(lon)){
      const n=nearestPoleGps(lat,lon); if(n.distance<=maxD)match=n;
    }
    items.push({file:f,date:new Date(dt),match,type:null});
    $("#importSummary").textContent=`Проанализировано ${i+1}/${files.length}`;
  }
  const groups={};
  items.forEach(it=>{const k=it.match?it.match.pole.projectPole:"x";(groups[k]??=[]).push(it);});
  Object.entries(groups).forEach(([k,a])=>{
    if(k==="x")return;a.sort((a,b)=>a.date-b.date);
    if(mode==="before")a.forEach(v=>v.type="BEFORE");
    else if(mode==="after")a.forEach(v=>v.type="AFTER");
    else{const cut=Math.ceil(a.length/2);a.forEach((v,i)=>v.type=i<cut?"BEFORE":"AFTER");}
  });
  importItems=items;
  const matched=items.filter(v=>v.match).length;
  $("#importSummary").innerHTML=`Всего: <b>${items.length}</b> · Сопоставлено: <b>${matched}</b> · Без Pole: <b>${items.length-matched}</b>`;
  $("#importPreview").innerHTML=items.map(v=>v.match
    ?`<div class="import-row">${v.file.name} → Pole ${v.match.pole.projectPole} (${Math.round(v.match.distance)} ft) → <b>${v.type}</b></div>`
    :`<div class="import-row bad">${v.file.name} — GPS/Pole не найден</div>`).join("");
  $("#startImportBtn").disabled=matched===0;$("#analyzeImportBtn").disabled=false;
}
async function runImport(){
  const a=importItems.filter(v=>v.match); if(!a.length)return;
  $("#startImportBtn").disabled=true; const counts={};
  for(let i=0;i<a.length;i++){
    const v=a[i],p=v.match.pole,k=`${p.projectPole}_${v.type}`;counts[k]=(counts[k]||0)+1;
    $("#importProgress").textContent=`Загрузка ${i+1}/${a.length}: Pole ${p.projectPole} ${v.type}`;
    try{await uploadOne(v.file,p,v.type,counts[k]);}
    catch(e){$("#importProgress").textContent=`Ошибка: ${v.file.name}: ${e.message||e}`;$("#startImportBtn").disabled=false;return;}
  }
  $("#importProgress").textContent=`Готово. Загружено ${a.length} фото.`;$("#startImportBtn").disabled=false;
}
$("#importBtn").addEventListener("click",()=>{
  importItems=[];$("#bulkPhotos").value="";$("#bulkFolder").value="";
  $("#importSummary").innerHTML="";$("#importPreview").innerHTML="";$("#importProgress").textContent="";
  $("#startImportBtn").disabled=true;$("#importDialog").showModal();
});
$("#analyzeImportBtn").addEventListener("click",analyzeImport);
$("#startImportBtn").addEventListener("click",runImport);

$("#search").addEventListener("input", render);
$("#statusFilter").addEventListener("change", render);
$("#mapsBtn").addEventListener("click", openMyMaps);
$("#poleMapsBtn").addEventListener("click", openMyMaps);

$("#nearestBtn").addEventListener("click", ()=>{
  if(!navigator.geolocation) return alert("GPS недоступен");

  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude} = pos.coords;
    let best=poles[0], bestD=Infinity;

    poles.forEach(p=>{
      const d=(p.lat-latitude)**2+(p.lon-longitude)**2;
      if(d<bestD){bestD=d;best=p;}
    });

    openPole(best.projectPole);
  }, ()=>alert("Разрешите доступ к геолокации"));
});

createWorkFields();
render();

google.script.run
  .withSuccessHandler(config=>{
    myMapsUrl = config.myMapsUrl || "";
  })
  .getConfig();

google.script.run
  .withSuccessHandler(mergeRemote)
  .withFailureHandler(err=>console.warn(err))
  .getLatestChanges();
</script>
